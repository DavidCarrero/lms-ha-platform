ServerRoot "/usr/local/apache2"
ServerName localhost
Listen 80
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule status_module modules/mod_status.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_balancer_module modules/mod_proxy_balancer.so
LoadModule slotmem_shm_module modules/mod_slotmem_shm.so
LoadModule lbmethod_byrequests_module modules/mod_lbmethod_byrequests.so
LoadModule substitute_module modules/mod_substitute.so
LoadModule filter_module modules/mod_filter.so

TypesConfig conf/mime.types
ServerAdmin webmaster@localhost

<IfModule unixd_module>
    User daemon
    Group daemon
</IfModule>

DocumentRoot "/usr/local/apache2/htdocs"
<Directory "/usr/local/apache2/htdocs">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Proxy / Load balancer configuration for Moodle
ProxyPreserveHost On

# Inject a small client-side script into HTML responses to log the instance
AddOutputFilterByType SUBSTITUTE text/html
Substitute "s|</body>|<script>fetch('/serverinfo.php').then(r=>r.text()).then(t=>console.log('instance='+t.trim()));</script></body>|i"

<Proxy "balancer://moodlecluster">
    # Backends (no per-backend routes; Redis handles session state centrally)
    BalancerMember http://web1:80
    BalancerMember http://web2:80
    BalancerMember http://web3:80
    # Round-robin by requests. Sticky sessions removed because sessions are in Redis.
    ProxySet lbmethod=byrequests
</Proxy>

<VirtualHost *:80>
    ServerName localhost
    ProxyPass "/" "balancer://moodlecluster/"
    ProxyPassReverse "/" "balancer://moodlecluster/"
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 common
</VirtualHost>

ErrorLog /proc/self/fd/2
PidFile logs/httpd.pid

LogFormat "%h %l %u %t \"%r\" %>s %b" common
